name: Mollick Substack refresh

on:
  schedule:
    # Sunday 15:57 UTC = roughly 8:57am Pacific year-round
    - cron: '57 15 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet anthropic requests

      - name: Configure git identity
        run: |
          git config user.name 'mollick-refresh-bot'
          git config user.email 'noreply@github.com'

      - name: Run refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python scripts/mollick_refresh.py

      - name: Commit and push
        id: commit
        run: |
          git add docs/refresh-*.md docs/mollick-digest.md references.bib
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "refresh: Mollick digest $DATE"
            git push origin main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue if chapter-affecting shifts
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          REFRESH_FILE="docs/refresh-${DATE}.md"
          if [ -f "$REFRESH_FILE" ]; then
            COUNTS=$(head -n 5 "$REFRESH_FILE" | grep -E '^_' | head -n 1 || echo '_summary unavailable_')
            gh issue create \
              --repo rgt47/applied-genai \
              --title "Mollick refresh ${DATE}" \
              --body-file "$REFRESH_FILE" \
              || echo 'Issue creation skipped or failed'
          fi
